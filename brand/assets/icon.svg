  <rect x="6" y="7" width="17" height="4" rx="0.75" fill="#f4f7fa"/>
  <rect x="11" y="13" width="15" height="4" rx="0.75" fill="#61c8a4"/>
  <rect x="6" y="20" width="20" height="2" fill="#f4f7fa"/>
  <rect x="6" y="24" width="20" height="2" fill="#f4f7fa"/>
</svg>
